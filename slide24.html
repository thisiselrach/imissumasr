<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Slide 24</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #e0eafc, #cfdef3);
      font-family: 'Playfair Display', serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
    }

    .message {
      font-size: 3rem;
      color: #cc2b5e;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body onclick="goToNextSlide()">
  <div class="message" id="message"></div>

  <script>
    const text = "Mas, aku mau kamu, ngga mau yang lain";
    const container = document.getElementById('message');
    let i = 0;

    function typeLetter() {
      if (i < text.length) {
        container.innerHTML += text.charAt(i);
        i++;
        setTimeout(typeLetter, 90);
      }
    }

    setTimeout(typeLetter, 500);

    function goToNextSlide() {
      window.location.href = "slide25.html"; 
    }
  </script>
</body>
</html>
